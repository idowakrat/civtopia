        ctx.font = "10px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("💀", p.x + 9, y0 - 8);
      }
      for (const city of cities) {
        if (isExplored(city.r, city.c)) drawCity(city);
      }
      // ring around the selected city + little workers on the tiles being worked
      if (selectedCity) {
        const p = hexCenter(selectedCity.r, selectedCity.c);
        drawHex(p.x, p.y - liftAt(selectedCity.r, selectedCity.c), HEX - 3, null, "#ffd966", 3);
        ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        for (const t of workedTiles(selectedCity)) {
          const wp = hexCenter(t.r, t.c);
          const wtop = wp.y - liftAt(t.r, t.c);
          ctx.fillStyle = "rgba(255,255,255,0.9)";
          ctx.beginPath(); ctx.arc(wp.x + 13, wtop - 8, 8, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#e0a90f"; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillText("👷", wp.x + 13, wtop - 7);
        }
        ctx.textBaseline = "alphabetic";
      }
      if (selected) {
        // gently pulsing green rings show where you can go
        ctx.globalAlpha = 0.65 + 0.35 * Math.sin(animTime * 5);
        for (const t of reachableTiles(selected)) {
          const p = hexCenter(t.r, t.c);
          drawHex(p.x, p.y - liftAt(t.r, t.c), HEX - 5, null, "#33ff88", 3.5);
        }
        ctx.globalAlpha = 1;
      }
      for (const u of units) {
        let x, y;
        if (u.anim) {
          // walking! slide between tiles with a happy little hop
          const a = u.anim;
          const p1 = a.path[a.seg];
          const p2 = a.path[Math.min(a.seg + 1, a.path.length - 1)];
          if (u.owner !== playerKey && !isExplored(p1.r, p1.c) && !isExplored(p2.r, p2.c)) continue;
          const c1 = hexCenter(p1.r, p1.c), c2 = hexCenter(p2.r, p2.c);
          const t1 = c1.y - liftAt(p1.r, p1.c), t2 = c2.y - liftAt(p2.r, p2.c);
          x = c1.x + (c2.x - c1.x) * a.t;
          y = t1 + (t2 - t1) * a.t - Math.abs(Math.sin(a.t * Math.PI)) * 5;
        } else {
          if (u.owner !== playerKey && !isExplored(u.r, u.c)) continue; // hidden in fog
          const p = hexCenter(u.r, u.c);
          x = p.x; y = p.y - liftAt(u.r, u.c);
        }
        if (u === selected) {
          ctx.globalAlpha = 0.6 + 0.4 * Math.sin(animTime * 6);
          drawHex(x, y, HEX - 3, null, "#ffffff", 3);
          ctx.globalAlpha = 1;
        }
        drawUnit(u, x, y, u.anim ? u.anim.t : null);
        if (u.hp < 100) { // health bar for wounded units
          ctx.fillStyle = "#5a1010";
          ctx.fillRect(x - 11, y - 47, 22, 4);
          ctx.fillStyle = u.hp > 50 ? "#3fbf5a" : u.hp > 25 ? "#e0a90f" : "#d43a2b";
          ctx.fillRect(x - 11, y - 47, 22 * u.hp / 100, 4);
        }
      }
      ctx.restore();
    }

    // move all the walking animations forward a tiny bit each frame
    function updateAnimations(dt) {
      for (const u of units) {
        if (!u.anim) continue;
        u.anim.t += dt * 3; // walking speed: 3 tiles per second
        while (u.anim && u.anim.t >= 1) {
          u.anim.t -= 1;
          u.anim.seg++;
          if (u.anim.seg >= u.anim.path.length - 1) u.anim = null;
        }
      }
    }

    // the heartbeat of the game: draws a fresh frame 60 times a second
    let lastFrameTs = 0;
    function frame(ts) {
      const dt = Math.min(0.05, (ts - lastFrameTs) / 1000 || 0);
      lastFrameTs = ts;
      animTime = ts / 1000;
      updateAnimations(dt);
      if (playerKey) draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ===== UI PANELS =====
    const info = document.getElementById("info");
    const foundBtn = document.getElementById("foundCity");
    const improveBtn = document.getElementById("improve");
    const roadBtn = document.getElementById("buildRoad");
    const cityPanel = document.getElementById("cityPanel");
    const techBtn = document.getElementById("techBtn");
    const policyBtn = document.getElementById("policyBtn");

    function updateTopbar() {
      let sci = 0, cul = 0;
      for (const city of myCities()) {
        const y = cityYields(city);
        sci += y.s; cul += y.cu;
      }
      lastScience = sci; lastCulture = cul;
      document.getElementById("statTurn").textContent = "Turn " + turn;
      document.getElementById("statSci").textContent = "🔬 +" + sci;
      document.getElementById("statCul").textContent = "🎭 " + cultureBucket + " (+" + cul + ")";
      document.getElementById("statGold").textContent = "💰 " + gold;
      const happyNow = empireHappiness();
      document.getElementById("statHappy").textContent =
        (happyNow >= 0 ? "😊 +" : "😡 ") + happyNow;
      const gpSpan = document.getElementById("statGP");
      if (gsPoints > 0 || gePoints > 0 || playerKey === "ginglewhoppers") {
        gpSpan.style.display = "";
        gpSpan.textContent = "🧑‍🔬 " + gsPoints + "/" + gsNeed + "  👷‍♂️ " + gePoints + "/" + geNeed;
      }
      const techSpan = document.getElementById("statTech");
      if (currentTech) {
        const need = TECHS[currentTech].cost - scienceBucket;
        const turns = sci > 0 ? Math.ceil(need / sci) : "∞";
        techSpan.textContent = "Researching " + TECHS[currentTech].name + " (" + turns + " turns)";
      } else {
        techSpan.textContent = "";
      }
      techBtn.style.display = (!currentTech && availableTechs().length && myCities().length) ? "" : "none";
      document.getElementById("diploBtn").style.display =
        [...met].some(o => !CIVS[o].cityState) || [...met].some(o => CIVS[o].cityState) ? "" : "none";
      policyBtn.style.display = (cultureBucket >= nextPolicyCost() && availablePolicies().length) ? "" : "none";
    }

    function updateButtons() {
      foundBtn.style.display = (selected && selected.type === "settler") ? "" : "none";
      const canImprove = selected && (selected.type === "worker" || UNIT_TYPES[selected.type].canBuild) && !selected.working &&
        !improvements[selected.r + "," + selected.c] &&
        improvementFor(selected.r, selected.c, selected.owner) &&
        territorySet(playerKey).has(selected.r + "," + selected.c);
      improveBtn.style.display = canImprove ? "" : "none";
      if (canImprove) {
        improveBtn.textContent = "Build " + IMPROVEMENTS[improvementFor(selected.r, selected.c, selected.owner)].name;
      }
      // roads can be built ANYWHERE on land — connect your cities!
      const canRoad = selected && (selected.type === "worker" || UNIT_TYPES[selected.type].canBuild) && !selected.working &&
        TERRAIN[map[selected.r][selected.c]].walk &&
        !roads.has(selected.r + "," + selected.c);
      roadBtn.style.display = canRoad ? "" : "none";
    }

    function renderCityPanel() {
      if (!selectedCity || selectedCity.owner !== playerKey) {
        cityPanel.style.display = "none";
        return;
      }
      const city = selectedCity;
      const y = cityYields(city);
      const surplus = y.f - city.pop * 2;
      const growTurns = surplus > 0 ? Math.ceil((growthNeeded(city.pop) - city.foodBucket) / surplus) : "∞";
      const worked = workedTiles(city);
      const spec = Math.max(0, city.pop - worked.length);
      let html = "<b>🏙️ " + city.name + "</b> — 👥 " + city.pop +
        " (grows in " + growTurns + " turns) | 👷 working " + worked.length + " tiles" +
        (spec ? " + " + spec + " specialist" + (spec > 1 ? "s" : "") + " 🔬" : "") +
        " | 🍞 +" + surplus + " 🔨 +" + y.p +
        " 💰 +" + y.g + " 🔬 +" + y.s + " 🎭 +" + y.cu + "<br>";
      if (city.producing) {
        const left = Math.ceil((prodCost(city.producing) - city.prodBucket) / Math.max(1, y.p));
        html += "Building: <b>" + prodName(city.producing, city.owner) + "</b> (" + left + " turns) ";
      } else {
        html += "Choose what to build: ";
      }
      cityPanel.innerHTML = html;
      for (const opt of buildOptions(city)) {
        const btn = document.createElement("button");
        const cost = prodCost(opt);
        btn.textContent = prodName(opt, city.owner) + " (" + cost + "🔨)";
        if (city.producing === opt) btn.disabled = true;
        btn.addEventListener("click", () => {
          city.producing = opt;
          renderCityPanel();
        });
        cityPanel.appendChild(btn);
      }
      cityPanel.style.display = "";
    }

    function renderTechPanel() {
      // draws the whole tree in columns, like Civ 5's tech screen
      const list = document.getElementById("techList");
      list.innerHTML = "";
      const maxCol = Math.max(...Object.values(TECHS).map(t => t.col));
      const canPick = new Set(availableTechs());
      for (let col = 0; col <= maxCol; col++) {
        const colDiv = document.createElement("div");
        colDiv.className = "techCol";
        const era = document.createElement("div");
        era.className = "techEra";
        era.textContent = TECH_ERAS[col];
        colDiv.appendChild(era);
        for (const [key, t] of Object.entries(TECHS)) {
          if (t.col !== col) continue;
          const card = document.createElement("button");
          card.className = "civCard techCard";
          const turns = lastScience > 0 ? Math.ceil(Math.max(0, t.cost - scienceBucket) / lastScience) : "?";
          let status = "";
          if (researched.has(key)) { card.classList.add("done"); status = "✅ done"; }
          else if (!canPick.has(key)) {
            card.classList.add("locked");
            status = "🔒 needs " + t.req.filter(rq => !researched.has(rq)).map(rq => TECHS[rq].name).join(", ");
          } else {
            status = t.cost + " 🔬 (about " + turns + " turns)";
          }
          card.innerHTML = '<div class="civName">' + t.name + "</div>" +
            '<div class="ability">' + t.gives + "</div>" +
            '<div class="leader">' + status + "</div>";
          if (canPick.has(key)) {
            card.addEventListener("click", () => {
              currentTech = key;
              document.getElementById("techPanel").style.display = "none";
              updateTopbar();
            });
          }
          colDiv.appendChild(card);
        }
        list.appendChild(colDiv);
      }
      document.getElementById("techPanel").style.display = "flex";
    }

    function renderPolicyPanel() {
      // one column per branch, like Civ 5's policy screen
      const list = document.getElementById("policyList");
      list.innerHTML = "";
      for (const [tk, tree] of Object.entries(POLICY_TREES)) {
        const colDiv = document.createElement("div");
        colDiv.className = "techCol";
        const treeOpen = adopted.has(tk);
        const openerCard = document.createElement("button");
        openerCard.className = "civCard techCard" + (treeOpen ? " done" : "");
        openerCard.innerHTML = '<div class="civName">' + tree.name + "</div>" +
          '<div class="ability">Opener: ' + tree.opener + "</div>" +
          (treeOpen ? '<div class="leader">✅ adopted</div>' : "");
        if (!treeOpen) openerCard.addEventListener("click", () => adoptPolicy(tk, tree.name));
        colDiv.appendChild(openerCard);
        for (const [pk, pol] of Object.entries(tree.policies)) {
          const done = adopted.has(pk);
          const card = document.createElement("button");
          card.className = "civCard techCard" + (done ? " done" : treeOpen ? "" : " locked");
          card.innerHTML = '<div class="civName">' + pol.name + "</div>" +
            '<div class="ability">' + pol.desc + "</div>" +
            (done ? '<div class="leader">✅ adopted</div>' :
             treeOpen ? "" : '<div class="leader">🔒 open ' + tree.name + " first</div>");
          if (treeOpen && !done) card.addEventListener("click", () => adoptPolicy(pk, pol.name));
          colDiv.appendChild(card);
        }
        list.appendChild(colDiv);
      }
      document.getElementById("policyCost").textContent = freePolicies > 0
        ? "🎁 The Oracle grants you a FREE policy — pick anything!"
        : "Next policy costs " + nextPolicyCost() + " 🎭 (you have " + cultureBucket + ")";
      document.getElementById("policyPanel").style.display = "flex";
    }

    function adoptPolicy(key, name) {
      const price = nextPolicyCost();
      if (freePolicies > 0) {
        freePolicies--;
      } else {
        if (cultureBucket < price) { document.getElementById("policyCost").textContent = "Not enough culture yet! Need " + price + " 🎭"; return; }
        cultureBucket -= price;
      }
      adopted.add(key);
      const pmult = (playerKey === "pigmen") ? 2 : 1; // Pigathy's policies hit twice as hard!
      if (key === "honor" || key === "military_tradition") {
        for (const u of units) {
          if (u.owner === playerKey && UNIT_TYPES[u.type].strength > 0) { u.maxMoves += pmult; u.moves += pmult; }
        }
      }
      if (key === "legalism") {
        const cap = capitalOf(playerKey);
        if (cap && !cap.buildings.includes("monument")) cap.buildings.push("monument");
      }
      if (key === "philanthropy") gold += 25 * pmult;
      if (key === "scientific_revolution") scienceBucket += 50 * pmult;
      document.getElementById("policyPanel").style.display = "none";
      info.textContent = "🎭 You adopted " + name + "!";
      updateTopbar();
      renderCityPanel();
      draw();
    }

    // the diplomacy screen: every leader you've met, with their mood
    function renderDiploPanel() {
      const list = document.getElementById("diploList");
      list.innerHTML = "";
      for (const o of [...met].filter(k => !CIVS[k].cityState)) {
        const d = diploOf(o);
        const card = document.createElement("div");
        card.className = "civCard";
        const face = document.createElement("canvas");
        face.width = 196; face.height = 74;
        face.className = "portrait";
        drawLeader(face.getContext("2d"), o, 196, 74);
        card.appendChild(face);
        const mood = d.attitude >= 2 ? "😊 Friendly" : d.attitude <= -2 ? "😠 Angry" : "😐 Neutral";
        const status = wars.has(o) ? "⚔️ AT WAR" : "🕊️ At peace";
        const infoDiv = document.createElement("div");
        infoDiv.innerHTML = '<div class="civName">' + CIVS[o].emoji + " " + CIVS[o].name + "</div>" +
          '<div class="leader">' + CIVS[o].leader + "</div>" +
          '<div class="ability">' + mood + " &nbsp;•&nbsp; " + status + "</div>";
        card.appendChild(infoDiv);
        const giftBtn = document.createElement("button");
        giftBtn.textContent = "🎁 Send 25💰 gift";
        giftBtn.addEventListener("click", () => {
          if (gold < 25) { document.querySelector("#diploPanel h2").textContent = "🤝 Diplomacy — not enough gold for a gift!"; return; }
          gold -= 25;
          d.attitude += 1;
          document.querySelector("#diploPanel h2").textContent = "🤝 " + CIVS[o].leader + " loves the gift!";
          updateTopbar();
          renderDiploPanel();
        });
        card.appendChild(giftBtn);
        const warBtn = document.createElement("button");
        if (wars.has(o)) {
          warBtn.textContent = "🕊️ Make Peace";
          warBtn.addEventListener("click", () => {
            if (turn - (d.warSince ?? turn) < 3) {
              document.querySelector("#diploPanel h2").textContent = "🤝 " + CIVS[o].leader + " is still furious — wait a few turns!";
              return;
            }
            wars.delete(o);
            d.warSince = null;
            d.attitude += 1;
            document.querySelector("#diploPanel h2").textContent = "🕊️ Peace with " + CIVS[o].name + "!";
            renderDiploPanel();
          });
        } else {
          warBtn.textContent = "⚔️ Declare War";
          warBtn.style.background = "#d46a5a";
          warBtn.addEventListener("click", () => {
            declareWar(o);
            showMessages();
            renderDiploPanel();
          });
        }
        card.appendChild(warBtn);
        list.appendChild(card);
      }
      // the little city-states you know
      for (const o of [...met].filter(k => CIVS[k].cityState)) {
        const alive = cities.some(ct => ct.owner === o);
        const kind = { culture: "🎭 culture", gold: "💰 gold", food: "🍞 food for your capital",
                       production: "🔨 production for your capital" }[CIVS[o].cityState];
        const card = document.createElement("div");
        card.className = "civCard";
        card.innerHTML = '<div class="civName">' + CIVS[o].emoji + " " + CIVS[o].name + " (city-state)</div>" +
          '<div class="ability">' + (alive ? "Sends you " + kind + " every turn" : "😢 conquered — sends nothing") + "</div>";
        list.appendChild(card);
      }
      document.getElementById("diploPanel").style.display = "flex";
    }
    document.getElementById("diploBtn").addEventListener("click", () => {
      document.querySelector("#diploPanel h2").textContent = "🤝 Diplomacy";
      renderDiploPanel();
    });
    document.getElementById("diploClose").addEventListener("click", () => {
      document.getElementById("diploPanel").style.display = "none";
    });

    techBtn.addEventListener("click", renderTechPanel);
    policyBtn.addEventListener("click", renderPolicyPanel);
    document.getElementById("techLater").addEventListener("click", () => {
      document.getElementById("techPanel").style.display = "none";
    });
    document.getElementById("policyLater").addEventListener("click", () => {
      document.getElementById("policyPanel").style.display = "none";
    });

    // hex distance (how many steps between two tiles)
    function hexDist(r1, c1, r2, c2) {
      const x1 = c1 - (r1 - (r1 & 1)) / 2, z1 = r1, y1 = -x1 - z1;
      const x2 = c2 - (r2 - (r2 & 1)) / 2, z2 = r2, y2 = -x2 - z2;
      return Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2), Math.abs(z1 - z2));
    }

    // arrows fly! ranged units shoot without getting hit back
    function rangedStrike(att, targetR, targetC) {
      const rStr = UNIT_TYPES[att.type].ranged;
      const defUnit = unitAt(targetR, targetC);
      const town = cityAt(targetR, targetC);
      declareWar(defUnit ? defUnit.owner : town.owner);
      if (defUnit) {
        if (UNIT_TYPES[defUnit.type].strength === 0) {
          units = units.filter(u => u !== defUnit);
          say("🏹 Your arrows scattered their " + UNIT_TYPES[defUnit.type].name + "!");
        } else {
          const dStr = UNIT_TYPES[defUnit.type].strength * defenseBonus(defUnit.r, defUnit.c);
          defUnit.hp -= Math.round(28 * (rStr / dStr) * (0.8 + Math.random() * 0.4));
          if (defUnit.hp <= 0) {
            units = units.filter(u => u !== defUnit);
            say("🏹 Bullseye! Enemy " + UNIT_TYPES[defUnit.type].name + " destroyed from afar!");
          } else {
            say("🏹 Direct hit! Enemy " + UNIT_TYPES[defUnit.type].name + " at " + defUnit.hp + " HP");
          }
        }
      } else if (town) {
        const dmg = Math.round(28 * (rStr / cityStrength(town)) * (0.8 + Math.random() * 0.4));
        town.hp = Math.max(1, town.hp - dmg); // arrows can't CAPTURE a city — send melee to finish it!
        say("🏹 You bombarded " + town.name + " — city at " + town.hp + " HP" + (town.hp === 1 ? " (send a melee unit to capture it!)" : ""));
      }
    }

    // your unit marches up and WHACKS the target (unit or city)
    function playerAttack(unit, targetR, targetC) {
      if (UNIT_TYPES[unit.type].strength === 0) {
        info.textContent = "That unit can't fight! Bring a Warrior.";
        return;
      }
      // ranged units (Archers, Ninja Rangers, the Gingleraider) shoot from 2 tiles away!
      if (UNIT_TYPES[unit.type].ranged) {
        if (hexDist(unit.r, unit.c, targetR, targetC) > 2) {
          info.textContent = "Too far! Ranged units shoot up to 2 tiles — move closer first.";
          return;
        }
        if (unit.moves <= 0) { info.textContent = "No moves left to shoot!"; return; }
        unit.moves = 0;
        rangedStrike(unit, targetR, targetC);
        selected = null;
        checkMeetings();
        showMessages();
        return;
      }
      const adjacent = neighbors(unit.r, unit.c).some(n => n.r === targetR && n.c === targetC);
      if (!adjacent) {
        // march next to the target first
        let best = null;
        for (const n of neighbors(targetR, targetC)) {
          if (!canWalk(unit, n.r, n.c) || unitAt(n.r, n.c)) continue;
          const blockTown = cityAt(n.r, n.c);
          if (blockTown && blockTown.owner !== unit.owner) continue;
          const route = pathTo(unit, n);
          if (route && route.cost < unit.moves && (!best || route.cost < best.cost)) best = route;
        }
        if (!best) { info.textContent = "Too far to attack this turn — get closer!"; return; }
        unit.moves -= best.cost;
        const end = best.path[best.path.length - 1];
        unit.r = end.r; unit.c = end.c;
        unit.anim = { path: best.path, seg: 0, t: 0 };
        for (const step of best.path) reveal(step.r, step.c, 2);
      }
      if (unit.moves <= 0) { info.textContent = "No moves left to attack!"; return; }
      unit.moves = 0; // attacking takes everything you've got
      const defUnit = unitAt(targetR, targetC);
      const town = cityAt(targetR, targetC);
      if (!defUnit && !town) return;
      declareWar(defUnit ? defUnit.owner : town.owner);
      if (defUnit) {
        const name = UNIT_TYPES[defUnit.type].name + " of " + CIVS[defUnit.owner].name;
        const result = battleUnits(unit, defUnit);
        if (result.captured) say("🎣 You captured a " + name + "!");
        else if (result.defDead) {
          say("⚔️ Victory! You destroyed a " + name + "!");
          if (unit.hp > 0 && TERRAIN[map[targetR][targetC]].walk && !cityAt(targetR, targetC)) {
            unit.anim = { path: [{ r: unit.r, c: unit.c }, { r: targetR, c: targetC }], seg: 0, t: 0 };
            unit.r = targetR; unit.c = targetC;
            raidCamp(targetR, targetC, true);
            reveal(targetR, targetC, 2);
          }
        }
        else if (result.attDead) say("💀 Your warrior fell in battle!");
        else say("⚔️ Clash! Your unit: " + unit.hp + " HP — theirs: " + defUnit.hp + " HP");
      } else {
        const prevOwner = town.owner;
        const result = battleCity(unit, town);
        if (result.captured) {
          say("🏆 YOU CAPTURED " + town.name.toUpperCase() + "!!!");
          diploOf(prevOwner).attitude -= 3; // they will NOT forget this
          for (const o of met) if (!CIVS[o].cityState && o !== prevOwner) diploOf(o).attitude -= 1;
        }
        else if (result.attDead) say("💀 Your warrior fell attacking " + town.name + "!");
        else say("💥 You attacked " + town.name + " — city at " + Math.max(0, town.hp) + " HP");
      }
      selected = null;
      checkMeetings();
      showMessages();
    }

    // ===== CLICKS AND TURNS =====
    function handleClick(x, y) {
      const hex = pixelToHex(x, y);
      if (!hex) return;

      const town = cityAt(hex.r, hex.c);
      const clickedUnit = unitAt(hex.r, hex.c);
      if (clickedUnit && (clickedUnit.owner === playerKey || isExplored(hex.r, hex.c))) {
        if (clickedUnit.owner === playerKey) {
          selected = (selected === clickedUnit) ? null : clickedUnit;
          selectedCity = null;
        } else if (selected) {
          playerAttack(selected, hex.r, hex.c); // CHARGE!
        } else {
          info.textContent = "That's a " + UNIT_TYPES[clickedUnit.type].name + " of " + CIVS[clickedUnit.owner].name + "!";
        }
      } else if (town && town.owner !== playerKey && isExplored(hex.r, hex.c) && selected) {
        playerAttack(selected, hex.r, hex.c); // storm the city!
      } else if (town && isExplored(hex.r, hex.c) && !selected) {
        if (town.owner === playerKey) {
          selectedCity = (selectedCity === town) ? null : town;
          selected = null;
        } else {
          info.textContent = "That's " + town.name + ", a city of " + CIVS[town.owner].name + "!";
        }
      } else if (selected) {
        const route = pathTo(selected, hex);
        if (route) {
          selected.moves -= route.cost; // roads make steps cheaper!
          selected.working = null; // a moving worker abandons the job
          selected.r = hex.r; selected.c = hex.c;
          selected.anim = { path: route.path, seg: 0, t: 0 }; // walk it, don't teleport!
          for (const step of route.path) reveal(step.r, step.c, 2); // see everything along the way
          raidCamp(hex.r, hex.c, true); // stomping a barbarian camp destroys it!
          checkRuin(hex.r, hex.c); // and ruins hold treasure!
          info.textContent = TERRAIN[map[hex.r][hex.c]].name + " — moves left: " + selected.moves;
          if (selected.moves <= 0) selected = null;
          checkMeetings();
          showMessages(); // "You met..." is big news!
        } else {
          info.textContent = "Can't go there! " + TERRAIN[map[hex.r][hex.c]].name;
        }
      } else {
        selectedCity = null;
      }
      updateButtons();
      renderCityPanel();
      draw();
    }

    // meeting other civilizations (they arrive in part 2!)
    function checkMeetings() {
      const others = [...new Set([...units, ...cities].map(o => o.owner))]
        .filter(o => o && o !== playerKey && o !== "barb");
      for (const o of others) {
        if (met.has(o)) continue;
        const spotted =
          units.some(u => u.owner === o && isExplored(u.r, u.c)) ||
          cities.some(ct => ct.owner === o && isExplored(ct.r, ct.c));
        if (spotted) {
          met.add(o);
          if (CIVS[o].cityState) {
            gold += 20;
            say("🤝 You met the city-state of " + CIVS[o].name + " " + CIVS[o].emoji + "! They send a welcome gift of 20 gold 💰");
          } else {
            say("🤝 You met " + CIVS[o].name + ", led by " + CIVS[o].leader + "!");
          }
        }
      }
    }

    let drag = null;
    canvas.addEventListener("mousedown", (e) => {
      drag = { sx: e.clientX, sy: e.clientY, camX: cam.x, camY: cam.y, moved: false };
    });
    canvas.addEventListener("mouseup", (e) => {
      if (drag && !drag.moved) {
        const rect = canvas.getBoundingClientRect();
        handleClick(e.clientX - rect.left + cam.x, e.clientY - rect.top + cam.y);
      }
      drag = null;
    });
    window.addEventListener("mouseup", () => { drag = null; });

    window.addEventListener("keydown", (e) => {
      const step = 60;
      if (e.key === "ArrowLeft") cam.x -= step;
      else if (e.key === "ArrowRight") cam.x += step;
      else if (e.key === "ArrowUp") cam.y -= step;
      else if (e.key === "ArrowDown") cam.y += step;
      else return;
      e.preventDefault();
      clampCam();
      draw();
    });

    canvas.addEventListener("mousemove", (e) => {
      if (drag) {
        const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
        if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
        if (drag.moved) {
          cam.x = drag.camX - dx;
          cam.y = drag.camY - dy;
          clampCam();
          draw();
        }
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const hex = pixelToHex(e.clientX - rect.left + cam.x, e.clientY - rect.top + cam.y);
      if (hex && !selected && !selectedCity) {
        if (!isExplored(hex.r, hex.c)) {
          info.textContent = "Unexplored ☁️ — send a scout!";
        } else {
          let text = TERRAIN[map[hex.r][hex.c]].name;
          const res = resources[hex.r + "," + hex.c];
          if (res) text += "  •  " + RESOURCES[res].icon + " " + RESOURCES[res].name +
            (RESOURCES[res].luxury ? " (LUXURY! " : " (") + RESOURCES[res].desc + ")";
          info.textContent = text;
        }
      }
    });

    foundBtn.addEventListener("click", () => {
      if (!selected || selected.type !== "settler") return;
      const settler = selected;
      if (allTerritory().has(settler.r + "," + settler.c)) {
        info.textContent = "Too close to another city! Move a bit further away.";
        return;
      }
      const names = CIVS[playerKey].cityNames;
      const count = myCities().length;
      const city = {
        r: settler.r, c: settler.c, owner: playerKey,
        name: names[count % names.length],
        pop: 1, foodBucket: 0, prodBucket: 0, producing: null, buildings: [], hp: 100,
      };
      cities.push(city);
      reveal(city.r, city.c, 2);
      units = units.filter(u => u !== settler);
      selected = null;
      selectedCity = city; // open the city panel so you can pick production!
      say("🎉 " + city.name + " founded! Pick what it should build.");
      showMessages();
      updateButtons();
      updateTopbar();
      renderCityPanel();
      draw();
    });

    improveBtn.addEventListener("click", () => {
      if (!selected || selected.working) return;
      if (selected.type !== "worker" && !UNIT_TYPES[selected.type].canBuild) return;
      const type = improvementFor(selected.r, selected.c, selected.owner);
      const key = selected.r + "," + selected.c;
      if (!type || improvements[key]) return;
      if (!territorySet(playerKey).has(key)) {
        info.textContent = "Workers can only build inside YOUR borders!";
        return;
      }
      selected.working = { type, turns: adopted.has("citizenship") ? 2 : 3 };
      info.textContent = "🛠️ Building a " + IMPROVEMENTS[type].name + " — ready in " + selected.working.turns + " turns! (Don't move the worker!)";
      selected = null;
      updateButtons();
      draw();
    });

    roadBtn.addEventListener("click", () => {
      if (!selected || selected.working) return;
      if (selected.type !== "worker" && !UNIT_TYPES[selected.type].canBuild) return;
      const key = selected.r + "," + selected.c;
      if (roads.has(key) || !TERRAIN[map[selected.r][selected.c]].walk) return;
      selected.working = { type: "road", turns: adopted.has("citizenship") ? 1 : 2 };
      info.textContent = "🛤️ Building a Road — ready in " + selected.working.turns + " turn" + (selected.working.turns > 1 ? "s" : "") + "! Roads make units faster and connect cities.";
      selected = null;
      updateButtons();
      draw();
    });

    function showMessages() {
      if (messages.length) {
        info.textContent = messages.slice(-3).join("  •  ");
        messages.length = 0;
      }
    }

    document.getElementById("endTurn").addEventListener("click", () => {
      // 0. workers finish their projects
      for (const u of units) {
        if (u.owner === playerKey && (u.type === "worker" || UNIT_TYPES[u.type].canBuild) && u.working) {
          u.working.turns--;
          if (u.working.turns <= 0) {
            if (u.working.type === "road") {
              roads.add(u.r + "," + u.c);
              say("🛤️ Your worker finished a Road!");
            } else {
              improvements[u.r + "," + u.c] = u.working.type;
              say("🛠️ Your worker finished a " + IMPROVEMENTS[u.working.type].name + "!");
            }
            u.working = null;
            terrainDirty = true;
          }
        }
      }
      // 0.5 how is everyone feeling?
      const prevHappy = lastHappiness;
      lastHappiness = empireHappiness();
      if (lastHappiness < 0 && prevHappy >= 0) {
        say("😡 Your empire is UNHAPPY! Cities stop growing — work more luxuries or build Colosseums!");
      } else if (lastHappiness >= 0 && prevHappy < 0) {
        say("😊 Your people are happy again! Cities can grow.");
      }
      // 1. your cities eat, grow, and build
      let sci = 0, cul = 0, gld = 0;
      for (const city of myCities()) {
        const y = processCity(city, 1);
        sci += y.s; cul += y.cu; gld += y.g;
      }
      scienceBucket += sci;
      cultureBucket += cul;
      gold += gld;
      // 1.4 gifts from city-states you've met (Patronage makes them extra generous!)
      const policyMult = (playerKey === "pigmen") ? 2 : 1; // double policy power!
      const csMult = 1 + (adopted.has("patronage") ? 0.5 * policyMult : 0);
      const friendlyCS = [...met].filter(o => CIVS[o].cityState && cities.some(ct => ct.owner === o));
      for (const o of friendlyCS) {
        const amt = Math.round(2 * csMult);
        const kind = CIVS[o].cityState;
        if (kind === "culture") cultureBucket += amt;
        else if (kind === "gold") gold += amt;
        else if (kind === "food") { const cap = capitalOf(playerKey); if (cap) cap.foodBucket += amt; }
        else if (kind === "production") { const cap = capitalOf(playerKey); if (cap) cap.prodBucket += amt; }
      }
      if (adopted.has("consulates")) cultureBucket += friendlyCS.length * policyMult;
      if (adopted.has("scholasticism")) scienceBucket += friendlyCS.length * policyMult;
      // 1.5 Great People points pile up
      let gs = 0, ge = 0;
      for (const city of myCities()) {
        if (city.buildings.includes("array")) ge += 2; // the Array's +2 engineer points!
        if (city.buildings.includes("university")) gs += 1;
        if (playerKey === "ginglewhoppers") {
          for (const t of workedTiles(city)) {
            const k = t.r + "," + t.c;
            if (resources[k] && RESOURCES[resources[k]].luxury && improvements[k]) { gs += 1; ge += 1; }
          }
        }
      }
      if (adopted.has("humanism")) gs += 2 * policyMult;
      gsPoints += gs; gePoints += ge;
      if (gsPoints >= gsNeed) {
        gsPoints -= gsNeed; gsNeed += 30;
        if (currentTech) {
          researched.add(currentTech);
          say("🧑‍🔬 A GREAT SCIENTIST appears and instantly finishes " + TECHS[currentTech].name + "!");
          currentTech = null;
        } else {
          const av = availableTechs();
          if (av.length) { researched.add(av[0]); say("🧑‍🔬 A GREAT SCIENTIST appears and discovers " + TECHS[av[0]].name + "!"); }
        }
      }
      if (gePoints >= geNeed) {
        gePoints -= geNeed; geNeed += 30;
        const cap = capitalOf(playerKey);
        if (cap) { cap.prodBucket += 60; say("👷‍♂️ A GREAT ENGINEER appears and hammers 60 production into " + cap.name + "!"); }
      }
      // 2. research marches on
      if (currentTech && scienceBucket >= TECHS[currentTech].cost) {
        scienceBucket -= TECHS[currentTech].cost;
        researched.add(currentTech);
        say("🔬 RESEARCHED: " + TECHS[currentTech].name + " — " + TECHS[currentTech].gives + "!");
        currentTech = null;
      }
      // 2.5 did we enter a new era?
      const era = eraOf();
      if (era > currentEra) {
        currentEra = era;
        say("🏰 Your civilization has entered the " + ERA_NAMES[era] + " Era!");
        if (playerKey === "boland") {
          freePolicies++;
          say("🥋 Bolun meditates on the new age... and grants you a FREE social policy!");
        }
      }
      // 3. everyone gets their moves back (and rests their wounds)
      turn++;
      selected = null;
      const myLand = territorySet(playerKey);
      for (const u of units) {
        if (u.owner !== playerKey) continue;
        u.moves = u.maxMoves;
        if (u.hp < 100) {
          let heal = myLand.has(u.r + "," + u.c) ? 20 : 10; // resting at home is best
          if (u.darkHeal && myLand.has(u.r + "," + u.c)) heal *= 2; // Dark Matter magic!
          if (adopted.has("professional_army")) heal += 10 * (playerKey === "pigmen" ? 2 : 1);
          u.hp = Math.min(100, u.hp + heal);
        }
      }
      for (const ct of cities) if (ct.hp < 100) ct.hp = Math.min(100, ct.hp + 10);
      aiTurn();
      barbarianTurn();
      checkMeetings();
      // angry leaders might declare war on YOU
      for (const o of met) {
        if (CIVS[o].cityState || wars.has(o)) continue;
        if (diploOf(o).attitude <= -4 && Math.random() < 0.15) {
          wars.add(o);
          diploOf(o).warSince = turn;
          say("⚔️ " + CIVS[o].name + " DECLARES WAR on you! " + CIVS[o].leader + " has had enough!");
        }
      }
      say("Turn " + turn + " — your move!");
      showMessages();
      updateButtons();
      updateTopbar();
      renderCityPanel();
      draw();
      // gentle nudges
      if (!currentTech && availableTechs().length && myCities().length) renderTechPanel();
      else if (cultureBucket >= nextPolicyCost() && availablePolicies().length) renderPolicyPanel();
    });

    // ===== THE AI CIVILIZATIONS =====
    let difficulty = "normal";
    // ai = how fast AI cities work; extra = bonus settlers on hard
    const DIFF = { easy: { ai: 0.6, extra: 0 }, normal: { ai: 1, extra: 0 }, hard: { ai: 1.5, extra: 1 } };

    document.querySelectorAll(".diffBtn").forEach(b => b.addEventListener("click", () => {
      difficulty = b.dataset.d;
      document.querySelectorAll(".diffBtn").forEach(x => x.classList.toggle("selected", x === b));
    }));

    function setupAI() {
      // pick 2 random rival civs (never yours)
      const keys = Object.keys(CIVS).filter(k => k !== playerKey && !CIVS[k].hidden);
      for (let i = keys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [keys[i], keys[j]] = [keys[j], keys[i]];
      }
      const start = units[0]; // your settler
      for (const ai of keys.slice(0, 5)) { // FIVE rivals — the whole world is playing!
        // give them a start far away from you (and from each other)
        let best = null, bestScore = -1;
        for (let tries = 0; tries < 400; tries++) {
          const r = Math.floor(Math.random() * ROWS), c = Math.floor(Math.random() * COLS);
          if (!TERRAIN[map[r][c]].walk || unitAt(r, c)) continue;
          const dPlayer = Math.abs(r - start.r) + Math.abs(c - start.c);
          const others = units.filter(u => u.owner !== playerKey);
          const dOthers = others.length ? Math.min(...others.map(u => Math.abs(u.r - r) + Math.abs(u.c - c))) : 99;
          const score = Math.min(dPlayer, dOthers);
          if (score > bestScore) { bestScore = score; best = { r, c }; }
        }
        if (best) {
          units.push(makeUnit("settler", best.r, best.c, ai));
          if (DIFF[difficulty].extra) { // hard mode: they start with TWO settlers
            const n = neighbors(best.r, best.c).find(nn => TERRAIN[map[nn.r][nn.c]].walk && !unitAt(nn.r, nn.c));
            if (n) units.push(makeUnit("settler", n.r, n.c, ai));
          }
        }
      }
    }

    function foundAICity(settler) {
      const names = CIVS[settler.owner].cityNames;
      const count = cities.filter(ct => ct.owner === settler.owner).length;
      cities.push({
        r: settler.r, c: settler.c, owner: settler.owner,
        name: names[count % names.length],
        pop: 1, foodBucket: 0, prodBucket: 0, producing: null, buildings: [], qi: 0, hp: 100,
      });
      units = units.filter(u => u !== settler);
    }

    // what AI cities like to build, in order, over and over
    const AI_BUILDS = ["scout", "settler", "warrior", "monument", "settler", "warrior"];

    function aiTurn() {
      const speed = DIFF[difficulty].ai;
      // AI units wander the world (settlers found cities when they find room)
      for (const u of units.filter(x => x.owner !== playerKey && x.owner !== "barb")) {
        u.moves = u.maxMoves;
        if (u.hp < 100) u.hp = Math.min(100, u.hp + 10);
        if (CIVS[u.owner].cityState) {
          // city-state guards stay home, but they DO defend the neighborhood
          const foe = neighbors(u.r, u.c).map(n => unitAt(n.r, n.c))
            .find(v => v && (v.owner === "barb" || (wars.has(u.owner) && v.owner === playerKey)));
          if (foe) battleUnits(u, foe);
          continue;
        }
        if (u.type === "settler") {
          u.age = (u.age || 0) + 1;
          if (u.age > 2 && !allTerritory().has(u.r + "," + u.c) && !cityAt(u.r, u.c)) {
            foundAICity(u);
            continue;
          }
        }
        // brave AI warriors fight barbarians next door — and YOU, if you're at war
        if (u.type === "warrior" && u.moves > 0) {
          const foe = neighbors(u.r, u.c)
            .map(n => unitAt(n.r, n.c))
            .find(v => v && v.owner !== u.owner &&
              (v.owner === "barb" || (wars.has(u.owner) && v.owner === playerKey)));
          if (foe) {
            const wasPlayers = foe.owner === playerKey;
            const foeName = UNIT_TYPES[foe.type].name;
            const result = battleUnits(u, foe);
            if (wasPlayers) {
              if (result.captured) say("😱 " + CIVS[u.owner].name + " captured your " + foeName + "!");
              else if (result.defDead) say("💀 " + CIVS[u.owner].name + " destroyed your " + foeName + "!");
              else say("⚔️ " + CIVS[u.owner].name + " attacked your " + foeName + " (" + Math.max(0, foe.hp) + " HP)!");
            }
            continue;
          }
          if (wars.has(u.owner)) {
            const targetCity = neighbors(u.r, u.c).map(n => cityAt(n.r, n.c))
              .find(ct => ct && ct.owner === playerKey);
            if (targetCity) {
              const result = battleCity(u, targetCity);
              if (result.captured) say("😱 " + CIVS[u.owner].name + " CAPTURED " + targetCity.name + "!");
              else say("💥 " + CIVS[u.owner].name + " attacked " + targetCity.name + " (" + Math.max(0, targetCity.hp) + " HP)!");
              continue;
            }
          }
        }
        const opts = neighbors(u.r, u.c).filter(n =>
          TERRAIN[map[n.r][n.c]].walk && !unitAt(n.r, n.c) &&
          !(cityAt(n.r, n.c) && cityAt(n.r, n.c).owner !== u.owner));
        if (opts.length) {
          const n = opts[Math.floor(Math.random() * opts.length)];
          u.anim = { path: [{ r: u.r, c: u.c }, { r: n.r, c: n.c }], seg: 0, t: 0 };
          u.r = n.r; u.c = n.c;
          raidCamp(n.r, n.c, false); // AI units also stomp camps
        }
      }
      // AI cities eat, grow, and build (speed depends on difficulty)
      // (city-states stay cozy and small — they don't expand)
      for (const city of cities.filter(ct => ct.owner !== playerKey && !CIVS[ct.owner].cityState)) {
        if (!city.producing) {
          let pick = AI_BUILDS[(city.qi || 0) % AI_BUILDS.length];
          if (BUILDINGS[pick] && city.buildings.includes(pick)) pick = "warrior";
          city.producing = pick;
          city.qi = (city.qi || 0) + 1;
        }
        processCity(city, speed);
      }
    }

    // ===== LEADER PORTRAITS =====
    // hand-drawn faces for every leader, painted right onto a little canvas!
    function drawLeader(g, key, w, h) {
      const civ = CIVS[key];
      const cx = w / 2;
      const grad = g.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, civ.primary);
      grad.addColorStop(1, shade(civ.primary, 0.45));
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);

      function shoulders(color) {
        g.fillStyle = color;
        g.beginPath(); g.ellipse(cx, h + 4, 26, 20, 0, Math.PI, 0); g.fill();
      }
      function head(color) {
        g.fillStyle = color;
        g.beginPath(); g.arc(cx, 34, 15, 0, Math.PI * 2); g.fill();
      }
      function eyes() {
        g.fillStyle = "#222";
        g.beginPath(); g.arc(cx - 5, 31, 1.8, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(cx + 5, 31, 1.8, 0, Math.PI * 2); g.fill();
      }
      function smile(big) {
        g.strokeStyle = "#7a4a2e"; g.lineWidth = 2; g.lineCap = "round";
        g.beginPath(); g.arc(cx, 36, big ? 6 : 4, 0.25 * Math.PI, 0.75 * Math.PI); g.stroke();
      }

      if (key === "diggers") { // Edward, always ready to dig
        g.strokeStyle = "#8a5a2a"; g.lineWidth = 4;
        g.beginPath(); g.moveTo(cx + 26, 64); g.lineTo(cx + 33, 18); g.stroke();
        g.fillStyle = "#9aa0aa";
        g.beginPath(); g.ellipse(cx + 34, 14, 4.5, 7, -0.15, 0, Math.PI * 2); g.fill();
        shoulders("#f28c1e"); head("#ffd9a6"); eyes(); smile(true);
        g.fillStyle = "#ffcf1f"; // hard hat
        g.beginPath(); g.arc(cx, 30, 15.5, Math.PI, 0); g.fill();
        g.fillRect(cx - 18, 28, 36, 4);
        g.fillStyle = "#b98a55"; // dirt smudge — a hard day's dig
        g.beginPath(); g.arc(cx - 9, 38, 2, 0, Math.PI * 2); g.fill();
      } else if (key === "ginglewhoppers") { // Professor Ginglewhop
        shoulders("#f4f4f8"); // lab coat
        g.fillStyle = "#ff8fc0"; // pink shirt peeking out
        g.beginPath(); g.moveTo(cx - 8, h); g.lineTo(cx + 8, h); g.lineTo(cx, 52); g.closePath(); g.fill();
        head("#f0cfa5");
        g.fillStyle = "#e8e8ee"; // wild white hair puffs
        g.beginPath(); g.arc(cx - 14, 27, 6.5, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(cx + 14, 27, 6.5, 0, Math.PI * 2); g.fill();
        eyes();
        g.strokeStyle = "#ff5fa8"; g.lineWidth = 2; // pink glasses!
        g.beginPath(); g.arc(cx - 5, 31, 5, 0, Math.PI * 2); g.stroke();
        g.beginPath(); g.arc(cx + 5, 31, 5, 0, Math.PI * 2); g.stroke();
        g.beginPath(); g.moveTo(cx - 1, 31); g.lineTo(cx + 1, 31); g.stroke();
        g.fillStyle = "#cfcfcf"; // grand moustache
        g.beginPath(); g.ellipse(cx - 4, 38, 4.5, 2.2, 0.2, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(cx + 4, 38, 4.5, 2.2, -0.2, 0, Math.PI * 2); g.fill();
      } else if (key === "boland") { // Bolun the Kung Fu Monk
        shoulders("#f2eee2"); // karate gi
        g.strokeStyle = "#2e2e2e"; g.lineWidth = 3; // gi collar
        g.beginPath(); g.moveTo(cx - 12, h); g.lineTo(cx, 56); g.lineTo(cx + 12, h); g.stroke();
        head("#e8b97f"); // bald and proud
        g.strokeStyle = "#5a3a1a"; g.lineWidth = 2; g.lineCap = "round"; // calm closed eyes
        g.beginPath(); g.arc(cx - 5, 31, 2.5, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
        g.beginPath(); g.arc(cx + 5, 31, 2.5, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
        smile(false);
        g.fillStyle = "#9a6a35"; // monk dots
        for (const dx of [-4, 0, 4]) { g.beginPath(); g.arc(cx + dx, 23, 1.2, 0, Math.PI * 2); g.fill(); }
        g.fillStyle = "#2e9e4f"; // green headband
        g.fillRect(cx - 15, 25, 30, 4);
      } else if (key === "pigmen") { // Pigathy
        shoulders("#d43a2b"); // royal red cape
        head("#f5a8c0");
        g.fillStyle = "#f5a8c0"; // pig ears
        g.beginPath(); g.moveTo(cx - 10, 24); g.lineTo(cx - 15, 14); g.lineTo(cx - 4, 20); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(cx + 10, 24); g.lineTo(cx + 15, 14); g.lineTo(cx + 4, 20); g.closePath(); g.fill();
        eyes();
        g.fillStyle = "#e87fa0"; // snout
        g.beginPath(); g.ellipse(cx, 37, 6.5, 5, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#c95f84";
        g.beginPath(); g.arc(cx - 2.5, 37, 1.3, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(cx + 2.5, 37, 1.3, 0, Math.PI * 2); g.fill();
      } else if (key === "pigeonians") { // Dave. Just Dave.
        shoulders("#6d7585");
        g.fillStyle = "#3fbf5a"; // shimmery green neck feathers
        g.beginPath(); g.ellipse(cx, 54, 9, 7, 0, 0, Math.PI * 2); g.fill();
        head("#8b93a3");
        g.fillStyle = "white"; // big pigeon eyes
        g.beginPath(); g.arc(cx - 5, 30, 4, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(cx + 5, 30, 4, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#e0641e";
        g.beginPath(); g.arc(cx - 5, 30, 1.8, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(cx + 5, 30, 1.8, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#f2a531"; // beak
        g.beginPath(); g.moveTo(cx - 3, 36); g.lineTo(cx + 3, 36); g.lineTo(cx, 43); g.closePath(); g.fill();
      } else if (key === "humanity") { // Adam the Great (looks awesome)
        shoulders("#7a3fd4");
        g.strokeStyle = "#ffd21f"; g.lineWidth = 3; // golden trim
        g.beginPath(); g.arc(cx, h + 4, 24, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
        head("#ffd9a6");
        g.fillStyle = "#6a4a2a"; // hair
        g.beginPath(); g.arc(cx, 28, 14.5, Math.PI, 0); g.fill();
        g.fillStyle = "#ffd21f"; // the crown
        g.fillRect(cx - 12, 14, 24, 7);
        g.beginPath(); g.moveTo(cx - 12, 14); g.lineTo(cx - 8, 6); g.lineTo(cx - 4, 14); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(cx - 4, 14); g.lineTo(cx, 6); g.lineTo(cx + 4, 14); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(cx + 4, 14); g.lineTo(cx + 8, 6); g.lineTo(cx + 12, 14); g.closePath(); g.fill();
        g.fillStyle = "#d43a2b";
        g.beginPath(); g.arc(cx, 17.5, 1.8, 0, Math.PI * 2); g.fill();
        eyes(); smile(true);
        g.fillStyle = "white"; // ✨ awesome sparkle
        g.beginPath();
        g.moveTo(cx + 22, 18); g.lineTo(cx + 24, 23); g.lineTo(cx + 29, 25);
        g.lineTo(cx + 24, 27); g.lineTo(cx + 22, 32); g.lineTo(cx + 20, 27);
        g.lineTo(cx + 15, 25); g.lineTo(cx + 20, 23);
        g.closePath(); g.fill();
      } else if (key === "skooter") { // King Meir on his royal scooter
        g.strokeStyle = "#b8bec8"; g.lineWidth = 3; // handlebar
        g.beginPath(); g.moveTo(cx - 18, h - 2); g.lineTo(cx + 18, h - 2); g.stroke();
        g.beginPath(); g.moveTo(cx, h - 2); g.lineTo(cx, h + 6); g.stroke();
        shoulders("#7a3fd4");
        head("#ffd9a6"); eyes(); smile(true);
        g.fillStyle = "#5fc4dd"; // bike helmet
        g.beginPath(); g.arc(cx, 31, 15.5, Math.PI, 0); g.fill();
        g.strokeStyle = "#3fa0bb"; g.lineWidth = 2; // helmet vents
        g.beginPath(); g.moveTo(cx - 6, 18); g.lineTo(cx - 8, 29); g.stroke();
        g.beginPath(); g.moveTo(cx + 6, 18); g.lineTo(cx + 8, 29); g.stroke();
        g.strokeStyle = "#3fa0bb"; // chin strap
        g.beginPath(); g.moveTo(cx - 13, 33); g.lineTo(cx - 8, 44); g.stroke();
        g.fillStyle = "#ffd21f"; // a tiny crown ON the helmet, because he's the king
        g.fillRect(cx - 6, 10, 12, 5);
        g.beginPath(); g.moveTo(cx - 6, 10); g.lineTo(cx - 3, 4); g.lineTo(cx, 10); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(cx, 10); g.lineTo(cx + 3, 4); g.lineTo(cx + 6, 10); g.closePath(); g.fill();
      }
    }

    // ===== START THE GAME =====
    const civList = document.getElementById("civList");
    for (const [key, civ] of Object.entries(CIVS)) {
      if (civ.hidden) continue; // barbarians don't get a card!
      const card = document.createElement("button");
      card.className = "civCard";
      card.innerHTML =
        '<div class="civName">' + civ.emoji + " " + civ.name + "</div>" +
        '<div class="stripe" style="background: linear-gradient(90deg,' + civ.primary + " 50%," + civ.secondary + ' 50%)"></div>' +
        '<div class="leader">Leader: ' + civ.leader + "</div>" +
        '<div class="ability">' + civ.ability + "</div>";
      // the leader's portrait, painted at the top of the card
      const face = document.createElement("canvas");
      face.width = 196; face.height = 74;
      face.className = "portrait";
      drawLeader(face.getContext("2d"), key, 196, 74);
      card.prepend(face);
      card.addEventListener("click", () => startGame(key));
      civList.appendChild(card);
    }

    function startGame(key) {
      playerKey = key;
      document.getElementById("picker").style.display = "none";
      document.getElementById("title").textContent =
        "🐢 The Civilisations of Turtltopia — " + CIVS[key].emoji + " " + CIVS[key].name;
      // your leader watches over the empire from the top bar
      const tmp = document.createElement("canvas");
      tmp.width = 196; tmp.height = 74;
      drawLeader(tmp.getContext("2d"), key, 196, 74);
      const myLeader = document.getElementById("myLeader");
      myLeader.getContext("2d").drawImage(tmp, 61, 0, 74, 74, 0, 0, 46, 46);
      myLeader.style.display = "";
      myLeader.title = CIVS[key].leader;
      researched.add("agriculture"); // every civ knows how to farm (like Civ 5!)
      makeMap();
      scatterResources();
      placeSettlerOnLand();
      setupAI(); // rival civilizations are out there somewhere...
      setupBarbarians(); // ...and so are the barbarians 💀
      setupCityStates(); // ...and some friendly little city-states 🐢
      scatterRuins(); // ...and treasure! 🏛️
      reveal(units[0].r, units[0].c, 2);
      centerCameraOn(units[0].r, units[0].c);
      info.textContent = CIVS[key].leader + " says: move the settler somewhere nice, then press Found City! (Drag the map to explore)";
      updateTopbar();
      draw();
    }
  </script>
</body>
